<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Intelligent EnterprAIse Summit — Sofia 2025</title>
        <script>
            // Single Page Apps for GitHub Pages
            // https://github.com/rafgraph/spa-github-pages
            // Redirects deep links to index.html so React Router can handle them.
            var pathSegmentsToKeep = 1; // keep the /aisummit/ repo segment
            var l = window.location;
            l.replace(
                l.protocol +
                    "//" +
                    l.hostname +
                    (l.port ? ":" + l.port : "") +
                    l.pathname
                        .split("/")
                        .slice(0, 1 + pathSegmentsToKeep)
                        .join("/") +
                    "/?/" +
                    l.pathname
                        .slice(1)
                        .split("/")
                        .slice(pathSegmentsToKeep)
                        .join("/")
                        .replace(/&/g, "~and~") +
                    (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
                    l.hash
            );
        </script>
    </head>
    <body></body>
</html>
